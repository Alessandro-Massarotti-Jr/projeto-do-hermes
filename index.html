<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Uma pequena página de boas-vindas do Hermes.">
  <title>Olá do Hermes</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(98, 75, 220, .19), transparent 34rem),
        radial-gradient(ellipse at 12% 88%, rgba(43, 190, 196, .10), transparent 28rem),
        #0b1020;
    }
    main {
      width: min(92vw, 680px);
      padding: clamp(2.5rem, 8vw, 5rem) 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0, 0, 0, .38), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
    }
    .mark {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 2rem;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 24px;
      background: linear-gradient(135deg, #8d79ff, #56d6d0);
      box-shadow: 0 12px 40px rgba(118, 111, 255, .28);
      font-size: 2rem;
      font-weight: 800;
      color: #10152a;
      transform: rotate(-6deg);
    }
    .eyebrow {
      margin: 0 0 .8rem;
      color: #9fe6e2;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5.2rem);
      line-height: 1.04;
      letter-spacing: -.065em;
      background: linear-gradient(100deg, #fff 12%, #d8d2ff 55%, #91ece4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      margin: 1.25rem 0 0;
      color: #a9b1c8;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }
    .rule {
      width: 44px;
      height: 2px;
      margin: 2rem auto 0;
      border: 0;
      background: linear-gradient(90deg, #8d79ff, #56d6d0);
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
      .mark { animation: float 5s ease-in-out infinite; }
      @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-7px) rotate(-2deg); } }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">H</div>
    <p class="eyebrow">Um começo feito com carinho</p>
    <h1>Olá do Hermes</h1>
    <p class="sub">Uma pequena página, um grande começo.<br>Que bom ter você por aqui.</p>
    <hr class="rule">
  </main>
</body>
</html>
